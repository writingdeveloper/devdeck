<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./design/tokens.css" />
    <link rel="stylesheet" href="./design/base.css" />
    <link rel="stylesheet" href="./design/components.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./shell/shell.css" />
    <link rel="stylesheet" href="./features/projects/projects.css" />
    <link rel="stylesheet" href="./features/cockpit/cockpit.css" />
    <link rel="stylesheet" href="./features/secondary.css" />
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="icon" href="./assets/icon-256.png" />
    <title>DevDeck</title>
  </head>
  <body>
    <header id="topbar">
      <div class="tb-brand">
        <img class="tb-logo" src="./assets/icon-256.png" alt="" />
        <span class="tb-title">DevDeck</span>
      </div>
      <div class="tb-drag"></div>
      <div class="top-actions">
        <div class="menu-wrap shutdown-wrap hidden" id="shutdown-wrap">
          <button id="shutdown-btn" class="iconbtn" title="유휴 시 종료" aria-label="유휴 시 종료" aria-haspopup="menu" aria-expanded="false"></button>
        </div>
        <button id="refresh" class="iconbtn" title="새로고침" aria-label="새로고침"></button>
      </div>
      <div class="win-controls">
        <button id="win-min" class="winbtn" aria-label="Minimize" title="Minimize"></button>
        <button id="win-max" class="winbtn" aria-label="Maximize" title="Maximize"></button>
        <button id="win-close" class="winbtn winbtn-close" aria-label="Close" title="Close"></button>
      </div>
    </header>
    <div id="shell">
      <aside id="app-sidebar" aria-label="DevDeck">
        <div class="shell-side-head">
          <span class="shell-side-brand">DevDeck</span>
          <button id="shell-collapse" class="ui-icon-button" type="button" aria-expanded="true"></button>
        </div>
        <div id="shell-quick-wrap">
          <span class="shell-search-icon"></span>
          <input id="shell-quick-open" type="search" autocomplete="off" />
        </div>
        <nav class="shell-nav" aria-label="Views">
          <button class="rail-item active" data-view="projects" aria-current="page"><span class="rail-label"></span></button>
          <button class="rail-item" data-view="next"><span class="rail-label"></span></button>
          <button class="rail-item" data-view="usage"><span class="rail-label"></span></button>
        </nav>
        <div class="shell-scroll">
          <div id="shell-quick-results" class="hidden"></div>
          <section id="shell-session-section">
            <div id="shell-session-groups"></div>
          </section>
          <section id="shell-project-section">
            <div id="shell-projects-label" class="shell-section-label"></div>
            <div id="shell-projects"></div>
          </section>
        </div>
        <div class="shell-footer">
          <button class="rail-item" data-view="settings"><span class="rail-label"></span></button>
          <div class="menu-wrap lang-wrap">
            <button id="lang-btn" class="rail-item" title="Language" aria-label="Language" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">文</span><span class="rail-label"></span></button>
          </div>
        </div>
      </aside>
      <main id="content">
        <section id="view-projects" class="view active">
          <div class="view-toolbar">
            <button id="new-project" class="primary">+ 새 프로젝트</button>
            <input type="text" id="proj-search" placeholder="Search projects…" aria-label="Search projects…" />
            <select id="proj-sort" aria-label="Sort">
              <option value="activity">Activity</option>
              <option value="uncommitted">Uncommitted</option>
              <option value="name">Name</option>
              <option value="opened">Last opened</option>
            </select>
            <div class="menu-wrap project-display-wrap">
              <button id="project-display" class="chip" type="button" aria-haspopup="menu" aria-expanded="false">Display</button>
              <div id="project-display-menu" class="menu project-display-menu hidden" role="menu" aria-label="Display">
                <button id="show-hidden" class="menu-item" type="button" role="menuitemcheckbox" aria-checked="false">Show hidden projects <span id="hidden-count">0</span></button>
                <button id="view-cards" class="menu-item" type="button" role="menuitemradio" aria-checked="false">Cards</button>
                <button id="view-list" class="menu-item" type="button" role="menuitemradio" aria-checked="true">List</button>
                <div id="agent-select-control" class="display-agent-control hidden" role="group" aria-labelledby="agent-select-label">
                  <label id="agent-select-label" for="agent-select">Default agent for new sessions</label>
                  <select id="agent-select" aria-label="Agent"></select>
                </div>
              </div>
            </div>
            <span class="vt-spacer"></span>
            <span id="deck-pulse" class="deck-pulse"></span>
            <button id="open-selected" class="primary" disabled>▶ 선택 열기</button>
          </div>
          <!-- Intentionally empty pre-JS: mountProjects() shows the localized first-load skeleton;
               any hardcoded text here would flash in the wrong language before boot. -->
          <div id="cards"></div>
        </section>
        <section id="view-usage" class="view"></section>
        <section id="view-cockpit" class="view">
          <div class="ck-wrap">
            <aside id="ck-list" class="ck-list with-summary">
              <div class="ck-side-head">
                <button id="ck-new-session" class="ck-new" disabled><span class="ck-new-plus">+</span> <span id="ck-new-label"></span></button>
                <button id="ck-collapse" class="ck-collapse" aria-expanded="true">◀</button>
              </div>
              <div class="ck-search"><span>🔎</span><input id="ck-search" type="text" placeholder="" aria-label="Search sessions" /></div>
              <div id="ck-groups" class="ck-groups"></div>
            </aside>
            <button id="ck-expand" class="ck-expand" aria-expanded="false">▶</button>
            <section class="ck-main">
              <div id="ck-header" class="ck-header"></div>
              <div id="ck-terms" class="ck-terms"></div>
              <div id="ck-empty" class="ck-empty"></div>
            </section>
          </div>
        </section>
        <section id="view-settings" class="view"><div id="settings-form"></div></section>
        <section id="view-next" class="view"></section>
      </main>
    </div>
    <footer id="usage-bar" class="ub hidden" title="Claude usage"></footer>
    <div id="update-banner" class="hidden" role="status"></div>
    <div id="shutdown-banner" class="hidden" role="status" aria-live="polite"></div>
    <div id="toast-host" aria-live="assertive"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
