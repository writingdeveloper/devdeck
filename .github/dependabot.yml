version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-tooling:
        patterns: ["vitest", "@vitest/*", "vite"]
    ignore:
      # The types describe the Node that RUNS the code, which is the one bundled in Electron (24 in
      # Electron 43). A newer major would type-check APIs that do not exist at runtime; move it with
      # Electron, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 0.14 dropped Electron support (its release notes) and is published by a new releaser. The
      # terminal of every session runs on this package; stay on 0.13 until a release says Electron
      # works again.
      - dependency-name: "@homebridge/node-pty-prebuilt-multiarch"
        versions: [">=0.14.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
